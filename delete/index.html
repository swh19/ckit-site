<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号与数据删除 / Account & Data Deletion</title>
  <style>
    :root { --fg:#0f172a; --muted:#475569; --bg:#ffffff; --card:#f8fafc; --bd:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, "Noto Sans", sans-serif; color:var(--fg); background:var(--bg); }
    .wrap { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    header { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; justify-content:space-between; }
    h1 { margin:.25rem 0; font-size: clamp(1.4rem, 2.2vw + 1rem, 2rem); }
    .meta { color:var(--muted); font-size:.95rem; }
    .lang { display:flex; gap:.5rem; align-items:center; }
    .btn { border:1px solid var(--bd); background:#fff; padding:.35rem .6rem; border-radius:.5rem; cursor:pointer; font-size:.9rem; }
    .btn[aria-pressed="true"] { background:var(--card); }
    section { background:var(--card); border:1px solid var(--bd); border-radius:.75rem; padding:1rem; margin:1rem 0; }
    a { color:#0ea5e9; text-decoration:none; }
    a:hover { text-decoration:underline; }
    code { background:#f1f5f9; padding:.1rem .3rem; border-radius:4px; }
    footer { color:var(--muted); font-size:.9rem; margin:2rem 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="title">CKit</h1>
        <div class="meta"><span id="subtitle"></span> · <span id="updated"></span></div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button class="btn" id="btn-zh" data-lang="zh-CN">简体中文</button>
        <button class="btn" id="btn-en" data-lang="en">English</button>
      </div>
    </header>

    <div id="content">
      <section id="intro"></section><section id="inapp"></section><section id="email"></section><section id="sla"></section><section id="contact"></section>
    </div>

    <footer>
      <span id="footnote"></span>
    </footer>
  </div>

<script>
const i18n = {
  "zh-CN": {
    "title": "账号与数据删除",
    "subtitle": "适用平台：Android",
    "updated_prefix": "最近更新：",
    "footnote": "如对本页面内容有疑问，请通过以下邮箱联系我们：<a href=\"mailto:your-email@example.com\">your-email@example.com</a>",
    "sections": {
      "intro": "<p>\u672c\u9875\u7528\u4e8e\u5728\u4e0d\u8fdb\u5165\u5e94\u7528\u7684\u60c5\u51b5\u4e0b\uff0c\u63d0\u4ea4 <strong>CKit</strong> \u8d26\u53f7\u4e0e\u6570\u636e\u5220\u9664\u8bf7\u6c42\u3002</p>",      "inapp": "<h2>\u5728\u5e94\u7528\u5185\u5220\u9664</h2><p>\u6253\u5f00 CKit \u2192 \u8bbe\u7f6e \u2192 <strong>\u5220\u9664\u8d26\u53f7</strong>\u3002\u5220\u9664\u540e\uff0c\u6211\u4eec\u4f1a\u6e05\u9664\u4e0e\u4f60\u8d26\u53f7\u5173\u8054\u7684\u4e2a\u4eba\u6570\u636e\uff08\u4f9d\u6cd5\u9700\u4fdd\u7559\u7684\u6570\u636e\u9664\u5916\uff0c\u5982\u9632\u6b3a\u8bc8\u6216\u8d26\u52a1\u8bb0\u5f55\uff09\u3002</p>",      "email": "<h2>\u65e0\u6cd5\u767b\u5f55\uff1f\u4f7f\u7528\u90ae\u7bb1\u63d0\u4ea4</h2><p>\u53d1\u9001\u90ae\u4ef6\u81f3 <a href='mailto:your-email@example.com'>your-email@example.com</a>\uff0c\u4e3b\u9898\u5199\u201cCKit \u8d26\u53f7\u5220\u9664\u8bf7\u6c42\u201d\uff0c\u8bf7\u9644\uff1a\u7528\u4e8e\u767b\u5f55\u7684\u90ae\u7bb1/\u8d26\u53f7ID\u3001\u6240\u5728\u56fd\u5bb6/\u5730\u533a\u3001\uff08\u53ef\u9009\uff09\u5f53\u524d\u8bbe\u5907\u578b\u53f7\u3001\u5176\u4ed6\u8bf4\u660e\u3002</p>",      "sla": "<h2>\u5904\u7406\u65f6\u6548\u4e0e\u4fdd\u7559</h2><ul><li>\u6211\u4eec\u5c06\u5728\u6536\u5230\u8bf7\u6c42\u540e <strong>30 \u5929\u5185</strong>\u5904\u7406\uff08\u5fc5\u8981\u65f6\u4f1a\u8bf4\u660e\u5ef6\u957f\u539f\u56e0\uff09\u3002</li><li>\u4e3a\u7b26\u5408\u6cd5\u5f8b\u6216\u9632\u6b62\u6b3a\u8bc8\uff0c\u6211\u4eec\u53ef\u80fd\u5728\u9650\u5b9a\u65f6\u957f\u5185\u4fdd\u7559\u7279\u5b9a\u4fe1\u606f\u3002\u8be6\u89c1\u300a\u9690\u79c1\u653f\u7b56\u300b\u3002</li></ul>",      "contact": "<h2>\u8054\u7cfb\u7a97\u53e3</h2><p>\u90ae\u7bb1\uff1a<a href='mailto:your-email@example.com'>your-email@example.com</a></p>"
    }
  },
  "en": {
    "title": "Account & Data Deletion",
    "subtitle": "Platform: Android",
    "updated_prefix": "Last updated: ",
    "footnote": "If you have questions about this page, contact us at <a href=\"mailto:your-email@example.com\">your-email@example.com</a>.",
    "sections": {
      "intro": "<p>This page allows you to submit a <strong>CKit</strong> account & data deletion request without accessing the app.</p>",      "inapp": "<h2>Delete In\u2011App</h2><p>Open CKit \u2192 Settings \u2192 <strong>Delete account</strong>. We will remove personal data linked to your account (except data retained as required by law, e.g., anti\u2011fraud or billing records).</p>",      "email": "<h2>Can\u2019t sign in? Request via email</h2><p>Email <a href='mailto:your-email@example.com'>your-email@example.com</a> with subject \u201cCKit Account Deletion Request\u201d, and include: login email/account ID, country/region, (optional) device model, and any details.</p>",      "sla": "<h2>Timeline & Retention</h2><ul><li>We will process your request within <strong>30 days</strong> of receipt (extensions will be explained if needed).</li><li>Certain information may be retained for legal/fraud\u2011prevention purposes. See the Privacy Policy.</li></ul>",      "contact": "<h2>Contact</h2><p>Email: <a href='mailto:your-email@example.com'>your-email@example.com</a></p>"
    }
  }
};

function setLang(lang) {
  const dict = i18n[lang] || i18n["en"];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = "CKit · " + dict.title;
  document.getElementById("subtitle").textContent = dict.subtitle;
  document.getElementById("updated").textContent = dict.updated_prefix + new Date().toISOString().split("T")[0];
  document.getElementById("footnote").innerHTML = dict.footnote;
  for (const id in dict.sections) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = dict.sections[id];
  }
  document.getElementById("btn-zh").setAttribute("aria-pressed", lang === "zh-CN");
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
  const url = new URL(window.location);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url.toString());
}

function detectLang() {
  const urlLang = new URL(location.href).searchParams.get("lang");
  if (urlLang) return urlLang;
  const nav = (navigator.language || "en").toLowerCase();
  return nav.startsWith("zh") ? "zh-CN" : "en";
}

document.getElementById("btn-zh").onclick = () => setLang("zh-CN");
document.getElementById("btn-en").onclick = () => setLang("en");
setLang(detectLang());
</script>
</body>
</html>
