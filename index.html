<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CKit · Policy Portal</title>
  <style>
    :root{--fg:#0f172a;--muted:#475569;--bg:#fff;--card:#f8fafc;--bd:#e5e7eb;--accent:#0ea5e9}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,"Noto Sans",sans-serif;color:var(--fg);background:var(--bg)}
    .wrap{max-width:960px;margin:2rem auto;padding:0 1rem}
    header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
    h1{margin:.25rem 0;font-size:clamp(1.2rem,2vw + 1rem,1.8rem)}
    .meta{color:var(--muted);font-size:.95rem}
    .controls{display:flex;gap:.5rem;align-items:center}
    select,button{border:1px solid var(--bd);background:#fff;padding:.4rem .6rem;border-radius:.5rem;font-size:.9rem}
    .tabs{display:flex;gap:.5rem;margin:1rem 0}
    .tab{border:1px solid var(--bd);background:var(--card);padding:.45rem .7rem;border-radius:.5rem;cursor:pointer}
    .tab[aria-selected="true"]{background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px rgba(14,165,233,.15)}
    section.card{background:#fff;border:1px solid var(--bd);border-radius:.75rem;padding:1rem;margin:1rem 0}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    code{background:#f1f5f9;padding:.1rem .3rem;border-radius:4px}
    footer{color:var(--muted);font-size:.9rem;margin:2rem 0}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="title">CKit · Policy Portal</h1>
        <div class="meta"><span id="subtitle"></span> · <span id="updated"></span></div>
      </div>
      <div class="controls">
        <label for="lang" id="langLabel">Language</label>
        <select id="lang" aria-labelledby="langLabel">
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
        </select>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="CKit policies">
      <button class="tab" id="tab-privacy" role="tab" aria-controls="panel-privacy">Privacy</button>
      <button class="tab" id="tab-deletion" role="tab" aria-controls="panel-deletion">Deletion</button>
    </nav>

    <main>
      <section id="panel-privacy" class="card" role="tabpanel" aria-labelledby="tab-privacy"></section>
      <section id="panel-deletion" class="card" role="tabpanel" aria-labelledby="tab-deletion"></section>
    </main>

    <footer>
      <span id="footnote"></span>
    </footer>
  </div>

<script>

      <p>Email: <a href="mailto:hdlmky@gmail.com">hdlmky@gmail.com</a></p>

  "zh-CN": {

    footnote: '如有疑问，请联系：<a href="mailto:hdlmky@gmail.com">hdlmky@gmail.com</a>。',
    privacy: `

    deletion: `

      <p>打开 CKit → 设置 → <strong>删除账号</strong>。删除后，我们将清除与你账号关联的个人数据（法律需保留的数据除外，如反欺诈或账务记录）。</p>

      <p>发送邮件至 <a href="mailto:hdlmky@gmail.com">hdlmky@gmail.com</a>，主题写“CKit 账号删除请求”，请附：登录邮箱/账号ID、国家/地区、（可选）设备型号及其他说明。</p>
      <h3>处理时效与保留</h3>
      <ul>
        <li>收到请求后<strong>30 天内</strong>处理（必要时会说明延长原因）。</li>
        <li>为符合法律或防止欺诈，我们可能在限定时长内保留特定信息。详见《隐私政策》。</li>
      </ul>

      <p>邮箱：<a href="mailto:hdlmky@gmail.com">hdlmky@gmail.com</a></p>
    `
  }
};

const FALLBACKS = ["en"];

// util: pick best language
function pickLang() {
  const url = new URL(location.href);
  const urlLang = url.searchParams.get("lang");
  if (urlLang && I18N[urlLang]) return urlLang;
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("zh")) return "zh-CN";
  return "en";
}

function setLang(lang) {
  const dict = I18N[lang] || I18N["en"];
  document.documentElement.lang = lang;
  document.getElementById("lang").value = lang;
  document.getElementById("title").textContent = dict.title;
  document.getElementById("subtitle").textContent = dict.subtitle;
  document.getElementById("updated").textContent = (dict.updated_prefix || "Updated: ") + new Date().toISOString().split("T")[0];
  document.getElementById("tab-privacy").textContent = dict.tabs.privacy;
  document.getElementById("tab-deletion").textContent = dict.tabs.deletion;
  document.getElementById("panel-privacy").innerHTML = dict.privacy;
  document.getElementById("panel-deletion").innerHTML = dict.deletion;
  document.getElementById("footnote").innerHTML = dict.footnote;
  // persist in URL
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url.toString());
}

// tabs
function setTab(which) {
  const tabs = ["privacy","deletion"];
  tabs.forEach(t => {
    const selected = (t === which);
    document.getElementById("tab-"+t).setAttribute("aria-selected", selected ? "true" : "false");
    document.getElementById("panel-"+t).style.display = selected ? "block" : "none";
  });
  // persist in hash
  const url = new URL(location.href);
  url.hash = which;
  history.replaceState(null, "", url.toString());
}

document.getElementById("lang").addEventListener("change", e => setLang(e.target.value));
document.getElementById("tab-privacy").addEventListener("click", () => setTab("privacy"));
document.getElementById("tab-deletion").addEventListener("click", () => setTab("deletion"));

// initialize
const initialLang = pickLang();
setLang(initialLang);
const initialTab = (location.hash || "").replace("#","") || "privacy";
setTab(initialTab);
</script>
</body>
</html>
