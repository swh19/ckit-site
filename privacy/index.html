    "title": "Privacy Policy",

    "updated_prefix": "Last updated: ",

    "sections": {
      "intro": "<p>This Privacy Policy applies to the mobile application <strong>CKit</strong> (\"the App\"). We comply with applicable laws and Google Play policies, and explain how we collect, use, and protect data.</p>",      "collect": "<h2>Data We Collect</h2><ul><li>Account info (if accounts exist): email, display name, avatar.</li><li>Device & logs: model, OS/app version, crash reports.</li><li>Payments: processed by Google Play; we do not store full payment credentials.</li></ul><p><em>Replace with your actual data flows before release.</em></p>",      "use": "<h2>How We Use Data</h2><ul><li>Provide and maintain core features (including license checks).</li><li>Improve stability and UX (analytics & diagnostics).</li><li>Comply with legal and platform requirements (security & anti\u2011fraud).</li></ul>",      "third": "<h2>Third\u2011party SDKs/Services</h2><p>If you integrate Firebase, Sentry, etc., list each provider, purpose, data types, and link to their privacy policies.</p>",      "share": "<h2>Sharing & Transfers</h2><p>We do not sell personal data. We share/transfer only with service providers, for legal compliance, or with your consent.</p>",      "retention": "<h2>Retention & Security</h2><ul><li>Retained only as long as needed; then deleted or anonymized.</li><li>Encryption and access controls; transmission over <code>HTTPS</code>.</li></ul>",      "minor": "<h2>Children</h2><p>If children may use the App, add applicable children's privacy terms here and ensure compliance.</p>",      "rights": "<h2>Your Rights</h2><p>Subject to law, you may request access, correction, deletion, or withdraw consent. Contact us via the email below.</p>",      "contact": "<h2>Contact</h2><p>Privacy contact: <a href='mailto:your-email@example.com'>your-email@example.com</a><br>Developer name: <strong>Your Developer/Company</strong><br>Address: <strong>Your Legal Address</strong></p>",      "changes": "<h2>Changes</h2><p>Material updates will be announced in\u2011app or on this page. Continued use constitutes acceptance.</p>"

function setLang(lang) {
  const dict = i18n[lang] || i18n["en"];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = "CKit · " + dict.title;
  document.getElementById("subtitle").textContent = dict.subtitle;
  document.getElementById("updated").textContent = dict.updated_prefix + new Date().toISOString().split("T")[0];
  document.getElementById("footnote").innerHTML = dict.footnote;
  for (const id in dict.sections) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = dict.sections[id];
  }
  document.getElementById("btn-zh").setAttribute("aria-pressed", lang === "zh-CN");
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
  const url = new URL(window.location);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url.toString());
}

function detectLang() {
  const urlLang = new URL(location.href).searchParams.get("lang");
  if (urlLang) return urlLang;
  const nav = (navigator.language || "en").toLowerCase();
  return nav.startsWith("zh") ? "zh-CN" : "en";
}

document.getElementById("btn-zh").onclick = () => setLang("zh-CN");
document.getElementById("btn-en").onclick = () => setLang("en");
setLang(detectLang());
</script>
